# Windows Configuration Baseline - Windows 11 Enterprise
# Source: CIS Microsoft Windows 11 Enterprise Benchmark (https://www.cisecurity.org/cis-benchmarks)
# Each check names the policy setting it covers. Add the CIS recommendation number
# from the benchmark PDF in the "cis" field as checks are reviewed. Checks marked
# "Atlas-Tech policy" are organization rules, not CIS recommendations.
#
# Common fields:
#   id        unique check ID (never reuse a retired ID; REG-014 retired in 0.2.0, replaced by FW-001)
#   title     setting name as shown in Group Policy / the benchmark
#   severity  high | medium | low
#   type      registry | service | account | group | firewall | audit | software
#   expected  the compliant value (meaning depends on type, see each section)

name: Windows 11 Enterprise Baseline
version: 0.2.0
benchmark: CIS Microsoft Windows 11 Enterprise Benchmark

checks:
  # ---------------------------------------------------------------- registry
  # hive/path/value: where the setting lives
  # operator: equals | lte | gte    default: value Windows uses when not set
  - id: REG-001
    title: "User Account Control: Run all administrators in Admin Approval Mode"
    cis: ""
    severity: high
    type: registry
    hive: HKLM
    path: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    value: EnableLUA
    operator: equals
    expected: "1"
    default: 1

  - id: REG-002
    title: "User Account Control: Behavior of the elevation prompt for administrators"
    cis: ""
    severity: medium
    type: registry
    hive: HKLM
    path: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    value: ConsentPromptBehaviorAdmin
    operator: equals
    expected: "2"

  - id: REG-003
    title: "Interactive logon: Do not require CTRL+ALT+DEL (Disabled)"
    cis: ""
    severity: low
    type: registry
    hive: HKLM
    path: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    value: DisableCAD
    operator: equals
    expected: "0"

  - id: REG-004
    title: "Interactive logon: Machine inactivity limit (900 seconds or fewer)"
    cis: ""
    severity: medium
    type: registry
    hive: HKLM
    path: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    value: InactivityTimeoutSecs
    operator: lte
    expected: "900"

  - id: REG-005
    title: "Network access: Do not allow anonymous enumeration of SAM accounts"
    cis: ""
    severity: high
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Control\Lsa
    value: RestrictAnonymousSAM
    operator: equals
    expected: "1"
    default: 1

  - id: REG-006
    title: "Network access: Do not allow anonymous enumeration of SAM accounts and shares"
    cis: ""
    severity: high
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Control\Lsa
    value: RestrictAnonymous
    operator: equals
    expected: "1"

  - id: REG-007
    title: "Network security: LAN Manager authentication level (NTLMv2 only, refuse LM and NTLM)"
    cis: ""
    severity: high
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Control\Lsa
    value: LmCompatibilityLevel
    operator: equals
    expected: "5"

  - id: REG-008
    title: "Network security: Do not store LAN Manager hash value on next password change"
    cis: ""
    severity: high
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Control\Lsa
    value: NoLMHash
    operator: equals
    expected: "1"
    default: 1

  - id: REG-009
    title: "WDigest Authentication (disable storing plaintext credentials)"
    cis: ""
    severity: high
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest
    value: UseLogonCredential
    operator: equals
    expected: "0"
    default: 0

  - id: REG-010
    title: "Microsoft network server: Digitally sign communications (always)"
    cis: ""
    severity: medium
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    value: RequireSecuritySignature
    operator: equals
    expected: "1"

  - id: REG-011
    title: "Microsoft network client: Digitally sign communications (always)"
    cis: ""
    severity: medium
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
    value: RequireSecuritySignature
    operator: equals
    expected: "1"

  - id: REG-012
    title: "Configure SMB v1 server (Disabled)"
    cis: ""
    severity: high
    type: registry
    hive: HKLM
    path: SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    value: SMB1
    operator: equals
    expected: "0"

  - id: REG-013
    title: "Turn off Autoplay (All drives)"
    cis: ""
    severity: medium
    type: registry
    hive: HKLM
    path: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    value: NoDriveTypeAutoRun
    operator: equals
    expected: "255"

  # ---------------------------------------------------------------- services
  # service: short service name (not the display name)
  # expected: disabled | disabled_or_absent (not installed also counts as compliant)
  - id: SVC-001
    title: "Routing and Remote Access (RemoteAccess) is disabled"
    cis: ""
    severity: medium
    type: service
    service: RemoteAccess
    expected: disabled_or_absent

  - id: SVC-002
    title: "SSDP Discovery (SSDPSRV) is disabled"
    cis: ""
    severity: low
    type: service
    service: SSDPSRV
    expected: disabled_or_absent

  - id: SVC-003
    title: "UPnP Device Host (upnphost) is disabled"
    cis: ""
    severity: low
    type: service
    service: upnphost
    expected: disabled_or_absent

  - id: SVC-004
    title: "Windows Mobile Hotspot Service (icssvc) is disabled"
    cis: ""
    severity: medium
    type: service
    service: icssvc
    expected: disabled_or_absent

  - id: SVC-005
    title: "OpenSSH SSH Server (sshd) is disabled or not installed"
    cis: ""
    severity: medium
    type: service
    service: sshd
    expected: disabled_or_absent

  - id: SVC-006
    title: "Remote Procedure Call (RPC) Locator (RpcLocator) is disabled"
    cis: ""
    severity: low
    type: service
    service: RpcLocator
    expected: disabled_or_absent

  - id: SVC-007
    title: "Xbox Live Game Save (XblGameSave) is disabled"
    cis: ""
    severity: low
    type: service
    service: XblGameSave
    expected: disabled_or_absent

  # ---------------------------------------------------------------- accounts
  # account: guest | administrator (found by built-in ID, so renamed accounts are still checked)
  # expected: disabled | renamed
  - id: ACCT-001
    title: "Accounts: Guest account status (Disabled)"
    cis: ""
    severity: high
    type: account
    account: guest
    expected: disabled

  - id: ACCT-002
    title: "Accounts: Rename administrator account"
    cis: ""
    severity: medium
    type: account
    account: administrator
    expected: renamed

  # group: administrators (found by its well-known SID, works on any Windows language)
  # approved: every member must match one entry (account name, or COMPUTER\name)
  # Update this list per environment, including the renamed built-in administrator.
  - id: GRP-001
    title: "Only approved accounts are members of the local Administrators group"
    cis: "Atlas-Tech policy"
    severity: high
    type: group
    group: administrators
    approved:
      - Administrator
      - locadm          # renamed built-in Administrator in the lab (see lab\guest\Set-LocalHardening.ps1)
      - itadmin
      - Domain Admins

  # ---------------------------------------------------------------- firewall
  # profile: domain | private | public; Group Policy values override local values
  - id: FW-001
    title: "Windows Firewall: Domain profile firewall state (On)"
    cis: ""
    severity: high
    type: firewall
    profile: domain
    expected: "on"

  - id: FW-002
    title: "Windows Firewall: Private profile firewall state (On)"
    cis: ""
    severity: high
    type: firewall
    profile: private
    expected: "on"

  - id: FW-003
    title: "Windows Firewall: Public profile firewall state (On)"
    cis: ""
    severity: high
    type: firewall
    profile: public
    expected: "on"

  # ---------------------------------------------------------------- audit policy (requires administrator)
  # subcategory: GUID, which is the same on every Windows language
  # expected: success | failure | success_and_failure (more auditing than required is compliant)
  - id: AUD-001
    title: "Audit Credential Validation (Success and Failure)"
    cis: ""
    severity: medium
    type: audit
    subcategory: "{0CCE923F-69AE-11D9-BED3-505054503030}"
    expected: success_and_failure

  - id: AUD-002
    title: "Audit Security Group Management (Success)"
    cis: ""
    severity: medium
    type: audit
    subcategory: "{0CCE9237-69AE-11D9-BED3-505054503030}"
    expected: success

  - id: AUD-003
    title: "Audit User Account Management (Success and Failure)"
    cis: ""
    severity: medium
    type: audit
    subcategory: "{0CCE9235-69AE-11D9-BED3-505054503030}"
    expected: success_and_failure

  - id: AUD-004
    title: "Audit Account Lockout (Failure)"
    cis: ""
    severity: medium
    type: audit
    subcategory: "{0CCE9217-69AE-11D9-BED3-505054503030}"
    expected: failure

  - id: AUD-005
    title: "Audit Logon (Success and Failure)"
    cis: ""
    severity: high
    type: audit
    subcategory: "{0CCE9215-69AE-11D9-BED3-505054503030}"
    expected: success_and_failure

  - id: AUD-006
    title: "Audit Special Logon (Success)"
    cis: ""
    severity: medium
    type: audit
    subcategory: "{0CCE921B-69AE-11D9-BED3-505054503030}"
    expected: success

  - id: AUD-007
    title: "Audit Audit Policy Change (Success)"
    cis: ""
    severity: high
    type: audit
    subcategory: "{0CCE922F-69AE-11D9-BED3-505054503030}"
    expected: success

  # ---------------------------------------------------------------- installed software
  # pattern: regular expression matched against installed program names; expected: absent
  - id: SW-001
    title: "No peer-to-peer file sharing software installed"
    cis: "Atlas-Tech policy"
    severity: medium
    type: software
    pattern: "(?i)torrent|limewire|frostwire"
    expected: absent

  - id: SW-002
    title: "No unapproved remote access tools installed"
    cis: "Atlas-Tech policy"
    severity: high
    type: software
    pattern: "(?i)teamviewer|anydesk|ultraviewer|rustdesk"
    expected: absent
